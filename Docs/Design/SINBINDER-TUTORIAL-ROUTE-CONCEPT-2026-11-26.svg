<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="2700" viewBox="0 0 1600 2700"><title>Sinbinder — концепт расширенного обучения</title><desc>Схема маршрута, не точная геометрия сцены. По №68 и №69 разделам 17–20.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0L9 4L0 8Z" fill="#c6a674"/></marker><marker id="blue" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0L9 4L0 8Z" fill="#8bb4cc"/></marker></defs><rect width="1600" height="2700" fill="#18201f"/><rect x="22" y="22" width="1556" height="2656" rx="20" fill="none" stroke="#76674e" stroke-width="2"/><g font-family="Arial, sans-serif"><text x="800" y="63" font-size="33" fill="#f3e3c2" text-anchor="middle" font-weight="bold">SINBINDER — расширенное обучение во сне</text><text x="800" y="94" font-size="18" fill="#c1c9c1" text-anchor="middle">Концепт маршрута по №68 и №69 · 26.11.2026 · не геометрия Unity и не приёмка</text><path d="M815 229V256" fill="none" stroke="#c6a674" stroke-width="3"  marker-end="url(#arrow)"/><path d="M815 367V394" fill="none" stroke="#c6a674" stroke-width="3"  marker-end="url(#arrow)"/><path d="M815 505V532" fill="none" stroke="#c6a674" stroke-width="3"  marker-end="url(#arrow)"/><path d="M815 643V670" fill="none" stroke="#c6a674" stroke-width="3"  marker-end="url(#arrow)"/><path d="M815 1214V1243" fill="none" stroke="#c6a674" stroke-width="3"  marker-end="url(#arrow)"/><path d="M815 1354V1383" fill="none" stroke="#c6a674" stroke-width="3"  marker-end="url(#arrow)"/><path d="M815 1494V1523" fill="none" stroke="#c6a674" stroke-width="3"  marker-end="url(#arrow)"/><path d="M815 1634V1663" fill="none" stroke="#c6a674" stroke-width="3"  marker-end="url(#arrow)"/><path d="M815 1774V1803" fill="none" stroke="#c6a674" stroke-width="3"  marker-end="url(#arrow)"/><path d="M815 1914V1943" fill="none" stroke="#c6a674" stroke-width="3"  marker-end="url(#arrow)"/><path d="M815 781V799H280V813" fill="none" stroke="#c6a674" stroke-width="3"  marker-end="url(#arrow)"/><path d="M815 781V799H1325V813" fill="none" stroke="#8bb4cc" stroke-width="3" stroke-dasharray="9 7" marker-end="url(#blue)"/><path d="M280 924V1090H815V1103" fill="none" stroke="#c6a674" stroke-width="3"  marker-end="url(#arrow)"/><path d="M1325 924V956" fill="none" stroke="#8bb4cc" stroke-width="3" stroke-dasharray="9 7" marker-end="url(#blue)"/><path d="M1325 1067V1090H815V1103" fill="none" stroke="#8bb4cc" stroke-width="3" stroke-dasharray="9 7" marker-end="url(#blue)"/><path d="M580 1162H497" fill="none" stroke="#8bb4cc" stroke-width="3" stroke-dasharray="9 7" marker-end="url(#blue)"/><path d="M280 1214V1232H580V1243" fill="none" stroke="#8bb4cc" stroke-width="3" stroke-dasharray="9 7" marker-end="url(#blue)"/><path d="M1050 1302H1113" fill="none" stroke="#8bb4cc" stroke-width="3" stroke-dasharray="9 7" marker-end="url(#blue)"/><path d="M1325 1354V1374H1057V1383" fill="none" stroke="#8bb4cc" stroke-width="3" stroke-dasharray="9 7" marker-end="url(#blue)"/><path d="M580 1582H497" fill="none" stroke="#8bb4cc" stroke-width="3" stroke-dasharray="9 7" marker-end="url(#blue)"/><path d="M1050 1582H1113" fill="none" stroke="#8bb4cc" stroke-width="3" stroke-dasharray="9 7" marker-end="url(#blue)"/><path d="M280 1634V1655H580V1663" fill="none" stroke="#8bb4cc" stroke-width="3" stroke-dasharray="9 7" marker-end="url(#blue)"/><path d="M1325 1634V1655H1057V1663" fill="none" stroke="#8bb4cc" stroke-width="3" stroke-dasharray="9 7" marker-end="url(#blue)"/><path d="M580 1862H497" fill="none" stroke="#8bb4cc" stroke-width="3" stroke-dasharray="9 7" marker-end="url(#blue)"/><path d="M280 1914V1932H580V1943" fill="none" stroke="#8bb4cc" stroke-width="3" stroke-dasharray="9 7" marker-end="url(#blue)"/><path d="M1050 2002H1113" fill="none" stroke="#8bb4cc" stroke-width="3" stroke-dasharray="9 7" marker-end="url(#blue)"/><rect x="580" y="125" width="470" height="104" rx="14" fill="#29332f" stroke="#92b5a0" stroke-width="2" /><text x="596" y="153" fill="#f1e4ce" font-size="20" font-weight="bold">1. Опушка и пробуждение</text><text x="596" y="180" fill="#d2dbd5" font-size="15">ПКМ: движение; камера; указатели</text><text x="596" y="219" fill="#92b5a0" font-size="13">Есть в текущем коде / требуется приёмка</text><rect x="580" y="263" width="470" height="104" rx="14" fill="#29332f" stroke="#92b5a0" stroke-width="2" /><text x="596" y="291" fill="#f1e4ce" font-size="20" font-weight="bold">2. Умирающий у дороги</text><text x="596" y="318" fill="#d2dbd5" font-size="15">E: собрать душу; R: поднять; первый приказ</text><text x="596" y="357" fill="#92b5a0" font-size="13">Есть в текущем коде / требуется приёмка</text><rect x="580" y="401" width="470" height="104" rx="14" fill="#29332f" stroke="#92b5a0" stroke-width="2" /><text x="596" y="429" fill="#f1e4ce" font-size="20" font-weight="bold">3. Управление и бой</text><text x="596" y="456" fill="#d2dbd5" font-size="15">Tab: вид сверху / глаза; V: роль в первом лице</text><text x="596" y="477" fill="#d2dbd5" font-size="15">B: оружие; ЛКМ: удар; ПКМ: блок (Воин)</text><text x="596" y="495" fill="#92b5a0" font-size="13">Есть в текущем коде / требуется приёмка</text><rect x="580" y="539" width="470" height="104" rx="14" fill="#29332f" stroke="#92b5a0" stroke-width="2" /><text x="596" y="567" fill="#f1e4ce" font-size="20" font-weight="bold">4. Убийцы и погоня</text><text x="596" y="594" fill="#d2dbd5" font-size="15">Самостоятельная реакция или приказ догнать</text><text x="596" y="633" fill="#92b5a0" font-size="13">Есть в текущем коде / требуется приёмка</text><rect x="580" y="677" width="470" height="104" rx="14" fill="#29332f" stroke="#92b5a0" stroke-width="2" /><text x="596" y="705" fill="#f1e4ce" font-size="20" font-weight="bold">5. Мост, рычаг и первый Суд</text><text x="596" y="732" fill="#d2dbd5" font-size="15">Решение о приказе; вопрос игроку; полный Суд</text><text x="596" y="771" fill="#92b5a0" font-size="13">Есть в текущем коде / требуется приёмка</text><rect x="70" y="820" width="420" height="104" rx="14" fill="#29332f" stroke="#92b5a0" stroke-width="2" /><text x="86" y="848" fill="#f1e4ce" font-size="20" font-weight="bold">5а. Мост открыт</text><text x="86" y="875" fill="#d2dbd5" font-size="15">Проход напрямую; фактическое исполнение</text><text x="86" y="914" fill="#92b5a0" font-size="13">Есть в текущем коде / требуется приёмка</text><rect x="1120" y="820" width="410" height="104" rx="14" fill="#29332f" stroke="#92b5a0" stroke-width="2" /><text x="1136" y="848" fill="#f1e4ce" font-size="20" font-weight="bold">5б. Мост поднят</text><text x="1136" y="875" fill="#d2dbd5" font-size="15">Обход через лес; не считать задержку отказом</text><text x="1136" y="914" fill="#92b5a0" font-size="13">Есть в текущем коде / требуется приёмка</text><rect x="1120" y="963" width="410" height="104" rx="14" fill="#29332f" stroke="#d6b479" stroke-width="2" stroke-dasharray="8 5"/><text x="1136" y="991" fill="#f1e4ce" font-size="20" font-weight="bold">Павший охотник в лесу</text><text x="1136" y="1018" fill="#d2dbd5" font-size="15">Получение второго воина — по проекту №68</text><text x="1136" y="1057" fill="#d6b479" font-size="13">Проект / требуется реализация и проверка</text><rect x="580" y="1110" width="470" height="104" rx="14" fill="#29332f" stroke="#92b5a0" stroke-width="2" /><text x="596" y="1138" fill="#f1e4ce" font-size="20" font-weight="bold">6. Засада</text><text x="596" y="1165" fill="#d2dbd5" font-size="15">Бой; память о помощи или её отсутствии</text><text x="596" y="1204" fill="#92b5a0" font-size="13">Есть в текущем коде / требуется приёмка</text><rect x="70" y="1110" width="420" height="104" rx="14" fill="#29332f" stroke="#92b5a0" stroke-width="2" /><text x="86" y="1138" fill="#f1e4ce" font-size="20" font-weight="bold">6а. Ветка «опоздал»</text><text x="86" y="1165" fill="#d2dbd5" font-size="15">Сбор угасающей души и повторное поднятие</text><text x="86" y="1204" fill="#92b5a0" font-size="13">Есть в текущем коде / требуется приёмка</text><rect x="580" y="1250" width="470" height="104" rx="14" fill="#29332f" stroke="#92b5a0" stroke-width="2" /><text x="596" y="1278" fill="#f1e4ce" font-size="20" font-weight="bold">7. Повторный приказ</text><text x="596" y="1305" fill="#d2dbd5" font-size="15">После боя; короткий Суд; сравнение решений</text><text x="596" y="1344" fill="#92b5a0" font-size="13">Есть в текущем коде / требуется приёмка</text><rect x="1120" y="1250" width="410" height="104" rx="14" fill="#29332f" stroke="#92b5a0" stroke-width="2" /><text x="1136" y="1278" fill="#f1e4ce" font-size="20" font-weight="bold">7а. Шёпот (Z)</text><text x="1136" y="1305" fill="#d2dbd5" font-size="15">При отказе и доступной цели; может не сработать</text><text x="1136" y="1344" fill="#92b5a0" font-size="13">Есть в текущем коде / требуется приёмка</text><rect x="580" y="1390" width="470" height="104" rx="14" fill="#29332f" stroke="#d6b479" stroke-width="2" stroke-dasharray="8 5"/><text x="596" y="1418" fill="#f1e4ce" font-size="20" font-weight="bold">8. Знакомство с братьями</text><text x="596" y="1445" fill="#d2dbd5" font-size="15">История двух конкретных душ, не общая фамилия</text><text x="596" y="1484" fill="#d6b479" font-size="13">Проект / требуется реализация и проверка</text><rect x="70" y="1530" width="420" height="104" rx="14" fill="#29332f" stroke="#d6b479" stroke-width="2" stroke-dasharray="8 5"/><text x="86" y="1558" fill="#f1e4ce" font-size="20" font-weight="bold">9а. Спасение и прикрытие</text><text x="86" y="1585" fill="#d2dbd5" font-size="15">Удержание узкого прохода, помощь раненому</text><text x="86" y="1624" fill="#d6b479" font-size="13">Проект / требуется реализация и проверка</text><rect x="580" y="1530" width="470" height="104" rx="14" fill="#29332f" stroke="#d6b479" stroke-width="2" stroke-dasharray="8 5"/><text x="596" y="1558" fill="#f1e4ce" font-size="20" font-weight="bold">9. Расширенный боевой участок</text><text x="596" y="1585" fill="#d2dbd5" font-size="15">Разные геометрии боя; исходы через AOS</text><text x="596" y="1624" fill="#d6b479" font-size="13">Проект / требуется реализация и проверка</text><rect x="1120" y="1530" width="410" height="104" rx="14" fill="#29332f" stroke="#d6b479" stroke-width="2" stroke-dasharray="8 5"/><text x="1136" y="1558" fill="#f1e4ce" font-size="20" font-weight="bold">9б. Предложение сменить сторону</text><text x="1136" y="1585" fill="#d2dbd5" font-size="15">Бандит и Орден; помощь ≠ вступление</text><text x="1136" y="1624" fill="#d6b479" font-size="13">Проект / требуется реализация и проверка</text><rect x="580" y="1670" width="470" height="104" rx="14" fill="#29332f" stroke="#d6b479" stroke-width="2" stroke-dasharray="8 5"/><text x="596" y="1698" fill="#f1e4ce" font-size="20" font-weight="bold">10. Совместный механизм</text><text x="596" y="1725" fill="#d2dbd5" font-size="15">Бревно / переправа / ворот; два воина, прикрытие</text><text x="596" y="1764" fill="#d6b479" font-size="13">Проект / требуется реализация и проверка</text><rect x="580" y="1810" width="470" height="104" rx="14" fill="#29332f" stroke="#92b5a0" stroke-width="2" /><text x="596" y="1838" fill="#f1e4ce" font-size="20" font-weight="bold">11. Колонны и банки</text><text x="596" y="1865" fill="#d2dbd5" font-size="15">E, J, R; перенос и подготовка душ</text><text x="596" y="1904" fill="#92b5a0" font-size="13">Есть в текущем коде / требуется приёмка</text><rect x="70" y="1810" width="420" height="104" rx="14" fill="#29332f" stroke="#d6b479" stroke-width="2" stroke-dasharray="8 5"/><text x="86" y="1838" fill="#f1e4ce" font-size="20" font-weight="bold">Необязательное исследование</text><text x="86" y="1865" fill="#d2dbd5" font-size="15">Тайники, секреты, короткий обратный путь</text><text x="86" y="1904" fill="#d6b479" font-size="13">Проект / требуется реализация и проверка</text><rect x="580" y="1950" width="470" height="104" rx="14" fill="#29332f" stroke="#92b5a0" stroke-width="2" /><text x="596" y="1978" fill="#f1e4ce" font-size="20" font-weight="bold">12. Площадь пяти печатей</text><text x="596" y="2005" fill="#d2dbd5" font-size="15">Генератор состава; павшие стражи; пять позиций</text><text x="596" y="2044" fill="#92b5a0" font-size="13">Есть в текущем коде / требуется приёмка</text><rect x="1120" y="1950" width="410" height="104" rx="14" fill="#29332f" stroke="#d6b479" stroke-width="2" stroke-dasharray="8 5"/><text x="1136" y="1978" fill="#f1e4ce" font-size="20" font-weight="bold">Резерв при утрате состава</text><text x="1136" y="2005" fill="#d2dbd5" font-size="15">Доказать невозможность; помощь только во сне</text><text x="1136" y="2044" fill="#d6b479" font-size="13">Проект / требуется реализация и проверка</text><rect x="580" y="2330" width="470" height="104" rx="14" fill="#29332f" stroke="#92b5a0" stroke-width="2" /><text x="596" y="2358" fill="#f1e4ce" font-size="20" font-weight="bold">13. Открытие ворот и выход</text><text x="596" y="2385" fill="#d2dbd5" font-size="15">Все пять одновременно 1,2 с; F: ворота</text><text x="596" y="2424" fill="#92b5a0" font-size="13">Есть в текущем коде / требуется приёмка</text><rect x="70" y="125" width="420" height="620" rx="14" fill="#252e2b" stroke="#716a58"/><text x="90" y="160" fill="#f1e4ce" font-size="22" font-weight="bold">Правила обучения</text><text x="90" y="196" font-size="15" fill="#cdd7cf">Плашка — как; задача — что; стрелка — где.</text><text x="90" y="221" font-size="15" fill="#cdd7cf">Бог Смерти говорит короткими приказами,</text><text x="90" y="246" font-size="15" fill="#cdd7cf">не озвучивает клавиши и интерфейс.</text><text x="90" y="271" font-size="15" fill="#cdd7cf"></text><text x="90" y="296" font-size="15" fill="#cdd7cf">Tab — тактический вид / первое лицо.</text><text x="90" y="321" font-size="15" fill="#cdd7cf">V — Командир / Воин только в первом лице.</text><text x="90" y="346" font-size="15" fill="#cdd7cf">Командир: ЛКМ выбор, ПКМ приказ.</text><text x="90" y="371" font-size="15" fill="#cdd7cf">Воин: ЛКМ атака, ПКМ блок.</text><text x="90" y="396" font-size="15" fill="#cdd7cf">U — ручной Суд; Z — Шёпот.</text><text x="90" y="421" font-size="15" fill="#cdd7cf"></text><text x="90" y="446" font-size="15" fill="#cdd7cf">Первый Суд полный; следующие — короткие.</text><text x="90" y="471" font-size="15" fill="#cdd7cf">Показ автоматического Суда — по настройке;</text><text x="90" y="496" font-size="15" fill="#cdd7cf">ручной просмотр сохраняется.</text><text x="90" y="521" font-size="15" fill="#cdd7cf"></text><text x="90" y="546" font-size="15" fill="#cdd7cf">Не обещать послушания.</text><text x="90" y="571" font-size="15" fill="#cdd7cf">Не выдавать намерение за действие.</text><text x="90" y="596" font-size="15" fill="#cdd7cf">Не принуждать спасение и предательство.</text><text x="90" y="621" font-size="15" fill="#cdd7cf">Не раскрывать решение печатей заранее.</text><text x="90" y="646" font-size="15" fill="#cdd7cf"></text><text x="90" y="671" font-size="15" fill="#cdd7cf">Прогоны: обычный, NOCHASE, LATE.</text><text x="90" y="696" font-size="15" fill="#cdd7cf">Проверять без звука, с озвучкой, RU/EN.</text><rect x="1120" y="125" width="410" height="620" rx="14" fill="#252e2b" stroke="#716a58"/><text x="1140" y="160" fill="#f1e4ce" font-size="22" font-weight="bold">Легенда и ограничения</text><text x="1140" y="196" font-size="15" fill="#cdd7cf">Зелёный контур: есть в исходниках.</text><text x="1140" y="221" font-size="15" fill="#cdd7cf">Пунктирный золотой: проект.</text><text x="1140" y="246" font-size="15" fill="#cdd7cf">Синий путь: условная ветка / возврат.</text><text x="1140" y="271" font-size="15" fill="#cdd7cf"></text><text x="1140" y="296" font-size="15" fill="#cdd7cf">§20: цена поднятия и лечения (план).</text><text x="1140" y="321" font-size="15" fill="#cdd7cf">Боевое поднятие: весь запас сил, 1 HP.</text><text x="1140" y="346" font-size="15" fill="#cdd7cf">Лечение: половина максимума сил.</text><text x="1140" y="371" font-size="15" fill="#cdd7cf">Величина лечения не согласована.</text><text x="1140" y="396" font-size="15" fill="#cdd7cf">В склепе: полное здоровье.</text><text x="1140" y="421" font-size="15" fill="#cdd7cf"></text><text x="1140" y="446" font-size="15" fill="#cdd7cf">Не добавлять отдельную ману.</text><text x="1140" y="471" font-size="15" fill="#cdd7cf">Не скрывать бесплатное исцеление.</text><text x="1140" y="496" font-size="15" fill="#cdd7cf">Не менять формулу AOS ради урока.</text><text x="1140" y="521" font-size="15" fill="#cdd7cf"></text><text x="1140" y="546" font-size="15" fill="#cdd7cf">Необязательные секреты не нужны</text><text x="1140" y="571" font-size="15" fill="#cdd7cf">для прохождения.</text><text x="1140" y="596" font-size="15" fill="#cdd7cf">Охотник на службе Ордена не вступает</text><text x="1140" y="621" font-size="15" fill="#cdd7cf">в отряд Греховода автоматически.</text><text x="1140" y="646" font-size="15" fill="#cdd7cf"></text><text x="1140" y="671" font-size="15" fill="#cdd7cf">План 13–15 мин исторический;</text><text x="1140" y="696" font-size="15" fill="#cdd7cf">новый маршрут ещё не измерен.</text><rect x="140" y="2090" width="1320" height="208" rx="16" fill="#232d2a" stroke="#9e8d69"/><text x="800" y="2120" text-anchor="middle" font-size="21" fill="#f1e4ce">Пять печатей — одновременное присутствие пяти личностей</text><circle cx="280" cy="2190" r="44" fill="#343d35" stroke="#d6b479" stroke-width="3"/><text x="280" y="2186" font-size="16" text-anchor="middle" fill="#f1e4ce">Венец</text><text x="280" y="2208" font-size="16" text-anchor="middle" fill="#e1ceb0">Греховод</text><circle cx="540" cy="2190" r="44" fill="#343d35" stroke="#d6b479" stroke-width="3"/><text x="540" y="2186" font-size="16" text-anchor="middle" fill="#f1e4ce">Меч</text><text x="540" y="2208" font-size="16" text-anchor="middle" fill="#e1ceb0">Гнев</text><circle cx="800" cy="2190" r="44" fill="#343d35" stroke="#d6b479" stroke-width="3"/><text x="800" y="2186" font-size="16" text-anchor="middle" fill="#f1e4ce">Связь I</text><text x="800" y="2208" font-size="16" text-anchor="middle" fill="#e1ceb0">Брат 1</text><circle cx="1060" cy="2190" r="44" fill="#343d35" stroke="#d6b479" stroke-width="3"/><text x="1060" y="2186" font-size="16" text-anchor="middle" fill="#f1e4ce">Связь II</text><text x="1060" y="2208" font-size="16" text-anchor="middle" fill="#e1ceb0">Брат 2</text><circle cx="1320" cy="2190" r="44" fill="#343d35" stroke="#d6b479" stroke-width="3"/><text x="1320" y="2186" font-size="16" text-anchor="middle" fill="#f1e4ce">Крест</text><text x="1320" y="2208" font-size="16" text-anchor="middle" fill="#e1ceb0">Орден</text><path d="M800 2054V2085 M800 2298V2323" stroke="#c6a674" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="800" y="2270" fill="#cdd7cf" font-size="16" text-anchor="middle">Два разных ID одной родственной пары; один воин — одна плита; точный критерий Ордена требует согласования.</text><rect x="70" y="2480" width="1460" height="160" rx="14" fill="#252e2b" stroke="#716a58"/><text x="90" y="2512" font-size="20" font-weight="bold" fill="#f1e4ce">Статус концепта и источники</text><text x="90" y="2543" font-size="16" fill="#cdd7cf">Актуальная база: 03c56ca337f447c24dada405198a704bcccac5dc. №68: Assets/Scripts/docs/68-TUTORIAL-MAP.md.</text><text x="90" y="2571" font-size="16" fill="#cdd7cf">№69: Assets/Scripts/docs/69-PLAN.md, §17–20. Расширенный маршрут — согласовано попробовать, постановка не утверждена.</text><text x="90" y="2599" font-size="16" fill="#cdd7cf">Схема уточняет последовательность: засада до повторного приказа; обход условный; Шёпот — Z; печати не заменяют боевые уроки.</text><text x="90" y="2627" font-size="16" fill="#cdd7cf">Не является снимком Unity. Не вносит изменений в игровой код, канон, баланс и планы №68/69.</text></g></svg>