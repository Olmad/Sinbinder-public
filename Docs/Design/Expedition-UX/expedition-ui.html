<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Sinbinder — варианты интерфейса экспедиций</title>
<style>
:root{color-scheme:dark;--ink:#e8dfc9;--muted:#afa48f;--gold:#b89b61;--panel:#211b17;--border:#5d4d35;--cyan:#99c5cd;--red:#efad94}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% 30%,#26354a 0,#121723 48%,#090b10 90%);color:var(--ink);font:16px/1.45 Georgia,serif;min-height:100vh}button,select{font:inherit;color:inherit;background:#33291d;border:1px solid var(--border);padding:10px 14px;border-radius:3px;cursor:pointer}button:hover{border-color:var(--gold);background:#423522}button:focus-visible,select:focus-visible{outline:2px solid var(--cyan);outline-offset:3px}button[aria-pressed=true],button.primary{background:#5a4629;border-color:var(--gold)}button:disabled{opacity:.45;cursor:not-allowed}.bar{max-width:1240px;margin:auto;padding:18px 24px}.bar h1{font-size:22px;margin:0;color:#d6b777;font-weight:normal}.tools,.tabs,.actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}.tools{margin-top:14px}.note{color:var(--muted);font:13px/1.45 system-ui,sans-serif;margin:10px 0}.panel{max-width:1120px;min-height:540px;margin:10px auto 30px;border:1px solid var(--gold);background:linear-gradient(125deg,#2b221b,#191613);box-shadow:0 20px 60px #0009;padding:24px}.heading{display:flex;align-items:center;justify-content:space-between;gap:16px;border-bottom:1px solid var(--border);padding-bottom:14px}.heading h2{margin:0;font-weight:normal;font-size:28px}.tabs{margin:16px 0}.tabs button{background:transparent}.tabs button[aria-pressed=true]{background:#4a3925}.layout{display:grid;grid-template-columns:1.1fr 1fr;gap:24px;align-items:start}.box{border:1px solid var(--border);padding:18px;background:#16131077;min-width:0}.box h3{font-size:20px;font-weight:normal;margin:0 0 12px;color:#e5c78a}.box p{margin:8px 0 16px}.label{font:12px system-ui,sans-serif;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}.fact{padding:12px;background:#31281d;border:1px solid #51432d}.fact strong{display:block;font-size:22px;font-weight:normal}.fact span{font-size:13px;color:var(--muted)}.warning{border-left:3px solid #c57859;padding:10px 12px;background:#44271e66;color:var(--red);margin:14px 0}.known{border-left:3px solid #82aeb5;padding:10px 12px;background:#243b4160;margin:12px 0}.list{display:grid;gap:6px}.list button{text-align:left;display:flex;justify-content:space-between;align-items:center;gap:12px}.list small{color:var(--muted)}.actions{margin-top:20px;justify-content:space-between}.map{width:100%;height:auto;max-height:390px;display:block;background:#1b211c;border:1px solid #695b3d}.map text{fill:var(--ink);font:12px Georgia,serif;paint-order:stroke;stroke:#181813;stroke-width:3px;stroke-linejoin:round}.map .route{stroke:#9b885b;stroke-width:2;fill:none;stroke-dasharray:4 4}.map .river{stroke:#446b79;fill:none;stroke-width:14;opacity:.8}.map .node{fill:#c6a361;stroke:#15120f;stroke-width:2}.map .selected{fill:#ffe2a2;stroke:#fff1ce;stroke-width:3}.map .visited{fill:#92b5bf}.map .threat{fill:#c47258}.map button{padding:0}.mapWrap{position:relative}.legend{display:flex;flex-wrap:wrap;gap:12px;color:var(--muted);font-size:13px;margin:9px 0}.dot{display:inline-block;width:9px;height:9px;transform:rotate(45deg);background:#c6a361;margin-right:6px}.dot.blue{background:#92b5bf}.dot.red{background:#c47258}.portrait{width:58px;height:64px;background:radial-gradient(ellipse at center,#554a36,#1e1914);border:1px solid #665438;display:grid;place-items:center;flex-shrink:0;font-size:26px;color:#b8a77e}.leader{display:flex;gap:12px;align-items:center}.leader strong{font-size:19px;font-weight:normal}.leader small{display:block}.timeline{margin:12px 0;padding-left:16px;border-left:1px solid var(--gold)}.timeline p{margin:0 0 12px}.muted{color:var(--muted)}.tag{color:var(--cyan)}.art{height:126px;background:linear-gradient(0deg,#0c0e12dd,#171c2680),radial-gradient(ellipse at 70% 30%,#91452c,#291e1a 55%,#12141b);display:flex;align-items:flex-end;padding:12px;position:relative;overflow:hidden}.art:before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(95deg,transparent 0 50px,#19141750 51px 54px,transparent 55px 90px)}.art span{z-index:1;color:var(--muted);font-size:12px}.variant-b .layout{grid-template-columns: .8fr 1.2fr}.variant-b .facts{grid-template-columns:1fr}.variant-b .fact{display:flex;justify-content:space-between;align-items:center}.variant-b .art{display:none}.variant-c .map{border-radius:50%;aspect-ratio:1;max-width:380px;max-height:none;margin:auto;box-shadow:0 0 0 3px #73909b66, inset 0 0 50px #000}.variant-c .layout{grid-template-columns:1.15fr .85fr}.variant-c .facts{grid-template-columns:1fr}.variant-c .fact{display:flex;justify-content:space-between;align-items:center}.variant-c .box{border:none;background:transparent;padding:10px}.variant-c .art{height:95px}.footer{max-width:1120px;margin:0 auto 30px;padding:0 12px;color:var(--muted);font:13px system-ui,sans-serif}.sr{position:absolute;left:-9999px}@media(max-width:760px){.panel{margin:8px;padding:15px}.bar{padding:15px}.layout,.variant-b .layout,.variant-c .layout{grid-template-columns:1fr}.heading h2{font-size:23px}.facts{grid-template-columns:1fr}.map{max-height:320px}.actions{justify-content:flex-start}}
</style></head><body>
<header class="bar"><h1>Sinbinder · лаборатория интерфейса экспедиций</h1><div class="tools" id="variants"></div><div class="tools"><label for="context">Контекст:</label><select id="context"><option value="crypt">Карта склепа (6 мест)</option><option value="camp">Военный совет (3 места)</option></select></div><p class="note">Интерактивный макет, не Unity и не игровой результат. Данные взяты из разных предоставленных кадров; контексты разделены. География условная. Портреты и баннеры — заполнители, не новые игровые ресурсы.</p></header>
<main class="panel" id="panel"><div class="heading"><h2 id="title"></h2><button id="back" type="button">Esc · назад</button></div><nav class="tabs" id="tabs" aria-label="Экраны"></nav><div id="content"></div><div class="actions" id="actions"></div></main><footer class="footer" id="comment"></footer>
<script>
"use strict";
const variants=[["a","A · Атлас и карточки","Единая карта, компактные сведения, последовательный выбор. Базовый кандидат."],["b","B · Журнал разведки","Список и хронология важнее карты; плотнее, дешевле реализовать, менее атмосферно."],["c","C · Магический шар","Сохраняет диегетический образ совета; карта и атмосфера сильнее, меньше места для текста."]];
const crypt=[
{id:"chapel",name:"Придорожная часовня",x:210,y:136,visited:true,rumor:"Говорят, там кто-то ходит по ночам. Немного, но ходит.",enemies:"Двое",squad:"Трое",loot:"Души",known:["Вы здесь уже были; с тех пор прошло время.","Тайник взят.","Когда вы уходили, стражи там не осталось."],news:"По слухам, разграбленную часовню занял дозор Ордена.",restriction:"Нынешние автоматические отряды не умеют собирать души.",personal:true},
{id:"outpost",name:"Сожжённая застава",x:340,y:100,rumor:"Нет карточки в предоставленных кадрах склепа.",enemies:"Не показано",squad:"Не показано",loot:"Не показано",known:[]},
{id:"garrison",name:"Старый гарнизон",x:460,y:148,rumor:"Нет карточки в предоставленных кадрах.",enemies:"Не показано",squad:"Не показано",loot:"Не показано",known:[]},
{id:"convoy",name:"Соляной обоз",x:136,y:237,threat:true,rumor:"По старой соляной дороге ходит обоз. Охраны при нём двое, и те за деньги.",enemies:"Двое",squad:"Трое",loot:"Серебро",known:["Вы здесь уже были; с тех пор прошло время.","Обоз разграблен — охрана ушла на дорогу.","Мирон Звонарь — от его руки пали: Вейн Тихий."],personal:true},
{id:"quarry",name:"Затопленная каменоломня",x:325,y:239,rumor:"Нет карточки в предоставленных кадрах.",enemies:"Не показано",squad:"Не показано",loot:"Не показано",known:[]},
{id:"bog",name:"Костяная топь",x:474,y:272,rumor:"Туда уходят и не возвращаются. Причину никто не называет.",enemies:"Восьмеро",squad:"Шестеро",loot:"Возможен секрет",known:["Здесь ещё никто из ваших не был."],restriction:"Денег, согласно слуху, нет. Нынешние отряды не умеют искать секрет самостоятельно."}];
const camp=[{id:"chapel",name:"Придорожная часовня",x:155,y:220,busy:true,rumor:"В этом кадре там ваш отряд.",known:[]},{id:"quarry",name:"Затопленная каменоломня",x:355,y:245,busy:true,rumor:"В этом кадре там ваш отряд.",known:[]},{id:"outpost",name:"Брошенная застава",x:260,y:125,rumor:"Разведка донесла: за холмами стоит брошенная застава. Взять там есть что, и потому там небезопасно.",squad:"Пятеро",known:[],news:"Карган советует послать пятерых. Рядовой столько не уведёт.",loot:"Не уточнено"}];
const leaders=[["Вейн Тихий",8],["Марга Копатель",7],["Брат Хальд",5],["Косой Ждан",3],["Лиска Лучник",3],["Немой Гурт",3],["Одноглазый Хорь",3],["Толстый Ю",3],["Карган Старый Ворон",0]];
let variant="a",ctx="crypt",screen="map",selected="chapel",leader=-1,mode=null,party=new Set();
const $=id=>document.getElementById(id), data=()=>ctx==="camp"?camp:crypt, item=()=>data().find(d=>d.id===selected)||data()[0];
function esc(s){return String(s??"").replace(/[&<>"']/g,ch=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[ch]));}
function btn(text,act,opts=""){return '<button type="button" data-act="'+act+'" '+opts+'>'+esc(text)+'</button>'}
function header(t){return '<h3>'+esc(t)+'</h3>'}
function map(){const ds=data(), home=ctx==="camp"?[254,305]:[48,185];let routes=ctx==="camp"?[[home,ds[0]],[home,ds[1]],[home,ds[2]]]:[[home,ds[0]],[ds[0],ds[1]],[ds[1],ds[2]],[home,ds[3]],[ds[3],ds[4]],[ds[4],ds[5]]];return '<div class="mapWrap"><svg class="map" viewBox="0 0 550 370" role="img" aria-label="Условная карта, места выбираются списком ниже"><defs><pattern id="terrain" width="80" height="60" patternUnits="userSpaceOnUse"><path d="M-10 40Q40 -10 90 40M-10 50Q40 0 90 50" fill="none" stroke="#6b715b" opacity=".18"/></pattern></defs><rect width="550" height="370" fill="#292e24"/><rect width="550" height="370" fill="url(#terrain)"/><path d="M390 -10 Q350 70 395 132 T378 240 Q330 285 415 390" class="river"/>'+routes.map(([a,b])=>'<path class="route" d="M'+(a.x??a[0])+' '+(a.y??a[1])+' L'+b.x+' '+b.y+'"/>').join("")+'<rect x="'+(home[0]-6)+'" y="'+(home[1]-6)+'" width="12" height="12" fill="#ddd5ba" transform="rotate(45 '+home.join(" ")+')"/><text x="'+home[0]+'" y="'+(home[1]+22)+'" text-anchor="middle">'+(ctx==="camp"?"Лагерь":"Склеп")+'</text>'+ds.map(d=>'<rect x="'+(d.x-7)+'" y="'+(d.y-7)+'" width="14" height="14" class="node '+(d.id===selected?"selected":d.threat?"threat":d.visited||d.busy?"visited":"")+'" transform="rotate(45 '+d.x+' '+d.y+')"/><text x="'+d.x+'" y="'+(d.y+22)+'" text-anchor="middle">'+esc(d.name)+'</text>').join("")+'</svg></div><div class="legend"><span><i class="dot"></i>место</span><span><i class="dot blue"></i>посещено / занят отрядом</span><span><i class="dot red"></i>связь с угрозой</span></div>'}
function places(){return '<div class="list">'+data().map(d=>btn(d.name+(d.busy?" · ваш отряд":d.visited?" · посещено":""),"place:"+d.id,'aria-pressed="'+(d.id===selected)+'"')).join("")+'</div>'}
function facts(d){return '<div class="facts">'+[["Противники · по слуху",d.enemies||"Не показано"],["Совет о численности",d.squad||"Не показано"],["Возможная добыча",d.loot||"Не показано"]].map(([k,v])=>'<div class="fact"><span>'+esc(k)+'</span><strong>'+esc(v)+'</strong></div>').join("")+'</div>'}
function report(d){return '<div class="art"><span>Место для кадра реальной локации</span></div><p class="label">Слух / разведка</p><p>'+esc(d.rumor)+'</p>'+facts(d)+(d.known.length?'<div class="known"><div class="label">Что было известно при уходе</div><div class="timeline">'+d.known.map(x=>'<p>'+esc(x)+'</p>').join("")+'</div></div>':"")+(d.news?'<p class="tag">'+esc(d.news)+'</p>':"")+(d.restriction?'<div class="warning">'+esc(d.restriction)+'</div>':"")}
function threat(){return ctx==="crypt"?'<div class="warning"><div class="label">Личные счёты · предупреждение на карте</div>Ищет Греховода: Неждан Хмурый. Куда пойдёте вы, туда придёт и он.</div>':""}
function leaderList(){return '<div class="list">'+leaders.map(([n,k],i)=>btn(n+" · "+(k?"уведёт "+k:"телохранитель"),"leader:"+i,(k?"":"disabled ")+'aria-pressed="'+(leader===i)+'"')).join("")+'</div>'}
function render(){const d=item(),v=variants.find(x=>x[0]===variant);$("panel").className="panel variant-"+variant;$("variants").innerHTML=variants.map(([id,n])=>btn(n,"variant:"+id,'aria-pressed="'+(id===variant)+'"')).join("");$("tabs").innerHTML=[["map","1. Карта"],["card","2. Сведения"],["leader","3. Руководитель"],["party","4. Состав"]].map(([id,n])=>btn(n,"screen:"+id,'aria-pressed="'+(id===screen)+'" '+(id==="leader"&&d.busy||id==="party"&&(d.busy||leader<0&&mode!=="personal")?"disabled":""))).join("");$("comment").textContent=v[2]+" · "+(ctx==="crypt"?"Склеп: показанные слухи и память мест.":"Совет: отдельный кадр с двумя занятыми местами. Не смешивать с состоянием склепа.");
let body="",actions="";
if(screen==="map"){$("title").textContent=ctx==="camp"?"Военный совет":"Окрестности склепа";body=variant==="b"?'<div class="layout"><div class="box">'+header("Места")+places()+'</div><div class="box">'+header(d.name)+threat()+report(d)+'</div></div>':'<div class="layout"><div class="box">'+map()+places()+'</div><div class="box">'+header(d.name)+threat()+report(d)+'</div></div>';actions=btn("Закрыть макет","reset")+btn("Сведения о месте →","screen:card",'class="primary"');}
else if(screen==="card"){$("title").textContent=d.name;body='<div class="layout"><div class="box">'+report(d)+'</div><div class="box">'+header("Как действовать")+ (d.busy?'<p>Здесь уже ваш отряд. Новую отправку не моделируем.</p>':'<p>Автоматический поход: руководитель и его отряд принимают решения сами. Совет не гарантирует исход.</p><p>Личное участие: '+(d.personal&&ctx==="crypt"?"в текущем макете доступно. Греховод руководит на месте.":"не подтверждено для этого контекста.")+'</p>')+threat()+'</div></div>';actions=btn("← К карте","screen:map")+(d.busy?"":btn("Выбрать руководителя","auto",'class="primary"')+(ctx==="crypt"&&d.personal?btn("Пойти лично","personal"):""));}
else if(screen==="leader"){$("title").textContent="Кто поведёт отряд";const candidate=leaders[leader];body='<div class="layout"><div class="box">'+header("Кандидаты · пример из совета")+leaderList()+'</div><div class="box">'+header(d.name)+(candidate?'<div class="leader"><div class="portrait" aria-label="Место для портрета">♙</div><div><strong>'+esc(candidate[0])+'</strong><small>Уведёт '+candidate[1]+'</small></div></div><div class="known">Совет о численности: '+esc(d.squad||"не показан")+'</div><p class="muted">Характер, память, склонности и слова Каргана должны поступать из реальной игры. В предоставленных кадрах выбранный кандидат не показан, поэтому здесь нет выдуманного прогноза.</p>':'<p>Выберите имя. Здесь будут портрет и фактическая характеристика руководителя.</p>')+'<p>Состав влияет на решения, а не гарантирует победу.</p></div></div>';actions=btn("← К сведениям","screen:card")+btn("Выбрать состав →","screen:party",'class="primary" '+(leader<0?"disabled":""));}
else{$("title").textContent="Состав · демонстрация";const max=mode==="personal"?Math.max(0,({"Трое":3,"Пятеро":5,"Шестеро":6})[d.squad]-1||0):Math.max(0,(leaders[leader]?.[1]||0)-1);body='<div class="layout"><div class="box">'+header("Демонстрационный список")+ '<div class="list">'+leaders.map(([n,k],i)=>btn((party.has(i)?"✓ ":"")+n,"member:"+i,((!k||i===leader||(!party.has(i)&&party.size>=max))?"disabled ":"")+'aria-pressed="'+party.has(i)+'"')).join("")+'</div></div><div class="box">'+header("Перед выходом")+'<p>Ведёт: '+esc(mode==="personal"?"Греховод":leaders[leader]?.[0]||"не выбран")+'</p><p>Выбрано спутников: '+party.size+'</p><p>Доступность реальных воинов, раны, потери и лимиты проверяет игра; список здесь условный.</p>'+(d.restriction?'<div class="warning">'+esc(d.restriction)+'</div>':'')+'<p>Отряд может вернуться с потерями, но это не предрешено.</p><p class="muted">Подтверждение в макете не отправляет отряд.</p></div></div>';actions=btn("← Назад","screen:"+(mode==="personal"?"card":"leader"))+btn("Посмотреть итог выбора","confirm",'class="primary"');}
$("content").innerHTML=body;$("actions").innerHTML=actions;}
function go(s){if((s==="leader"||s==="party")&&item().busy)return;if(s==="party"&&leader<0&&mode!=="personal")return;screen=s;render();}
document.addEventListener("click",ev=>{let el=ev.target.closest("[data-act]");if(!el||el.disabled)return;const [act,val]=el.dataset.act.split(":");if(act==="variant")variant=val;else if(act==="screen"){go(val);return}else if(act==="place"){selected=val;leader=-1;party.clear();mode=null;}else if(act==="leader"){leader=Number(val);party.clear();mode="auto";}else if(act==="member"){const i=Number(val);party.has(i)?party.delete(i):party.add(i);}else if(act==="auto"){mode="auto";screen="leader";}else if(act==="personal"){mode="personal";leader=-1;party.clear();screen="party";}else if(act==="confirm"){alert("Это макет. Выбор показан, поход не отправлен.");return}else if(act==="reset"){screen="map";leader=-1;party.clear();mode=null;}render();});
$("context").addEventListener("change",ev=>{ctx=ev.target.value;selected=ctx==="camp"?"outpost":"chapel";screen="map";leader=-1;party.clear();mode=null;render()});function back(){go(screen==="party"?(mode==="personal"?"card":"leader"):screen==="leader"?"card":screen==="card"?"map":"map");}$("back").addEventListener("click",back);document.addEventListener("keydown",ev=>{if(ev.key==="Escape"){ev.preventDefault();back()}});render();
</script></body></html>
