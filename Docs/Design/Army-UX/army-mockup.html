<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sinbinder · Обзор армии</title><style>
:root{color-scheme:dark;--ink:#e5dcca;--muted:#b1a48d;--gold:#c6a773;--line:#554734;--paper:#201a15;--green:#9ab69b;--red:#cd9683}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% 0%,#293442,#11151b 70%);color:var(--ink);font:16px/1.45 Georgia,serif}button,input,select{font:inherit;color:inherit;background:#30271d;border:1px solid var(--line);padding:9px 12px;border-radius:3px}button{cursor:pointer}button:hover{border-color:var(--gold)}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid #9dc8cc;outline-offset:2px}button[aria-pressed=true]{background:#51402a;border-color:var(--gold)}main{max-width:1230px;margin:25px auto;padding:22px;border:1px solid var(--gold);background:linear-gradient(135deg,#2b231b,#181512);min-height:650px}h1,h2,h3{font-weight:normal;color:var(--gold);margin:0 0 10px}h1{font-size:29px}h2{font-size:24px}h3{font-size:18px}p{margin:8px 0}.muted,small{color:var(--muted);font:13px/1.5 system-ui,sans-serif}.nav,.sub,.toolbar,.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.nav{border-bottom:1px solid var(--line);padding:14px 0}.sub{margin:14px 0}.sub button{background:transparent;padding:8px}.sub button[aria-pressed=true]{background:#413421}.layout{display:grid;grid-template-columns:minmax(230px,300px) 1fr;gap:18px;margin-top:18px}.side,.detail,.block{border:1px solid var(--line);padding:16px;background:#17141077;min-width:0}.side input,.side select{width:100%;margin-bottom:8px}.roster{display:grid;gap:6px;max-height:530px;overflow:auto}.unit{text-align:left;display:block;width:100%}.unit small{display:block}.unit .away,.away{color:#c7ac75}.wound{color:var(--red)}.ready{color:var(--green)}.head{display:flex;gap:14px;align-items:center}.portrait{width:72px;height:84px;background:radial-gradient(ellipse,#63513a,#201b16);border:1px solid #68553c;display:grid;place-items:center;font-size:32px;color:#bbab87;flex-shrink:0}.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:15px 0}.facts div{background:#34291d;padding:12px;border:1px solid #53442f}.facts strong{display:block;font-size:20px;font-weight:normal}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.block{margin:8px 0}.row{justify-content:space-between}.subtle{font:13px system-ui,sans-serif;color:var(--muted);background:transparent;padding:5px 8px}.entry{border-bottom:1px solid #4f412f;padding:12px 0}.evidence{background:#242d2b;padding:12px;border-left:3px solid #78938c}.warning{background:#39251c;padding:12px;border-left:3px solid #af795d}.graph{width:100%;max-height:290px}.graph text{fill:var(--ink);font:13px Georgia,serif}.graph line{stroke-width:2}footer{margin-top:20px;border-top:1px solid var(--line);padding-top:10px}.slot{display:grid;grid-template-columns:1fr 1fr;gap:10px;border-bottom:1px solid var(--line);padding:10px 0}.status{min-height:25px;margin:12px 0;color:#b4cab4}.action{margin-top:12px}.active{color:var(--green)}@media(max-width:800px){main{margin:6px;padding:12px}.layout{grid-template-columns:1fr}.roster{max-height:220px}.grid,.facts{grid-template-columns:1fr}.slot{grid-template-columns:1fr}.nav button{padding:7px}.portrait{width:55px;height:62px}}
</style></head><body><main><header class="row"><div><small>ГРЕХОВОД · КОНЦЕПТ ИНТЕРФЕЙСА</small><h1>Обзор армии</h1></div><div class="muted">Условный состав · не игровой сейв</div></header><nav class="nav" id="nav"></nav><section id="view"></section><div class="status" id="status" role="status"></div><footer class="muted">Макет: все сведения и события условны. Кнопки перехода демонстрируют навигацию, не экипируют, не лечат, не отправляют, не тратят ресурсы и не меняют AOS. Источники и ограничения — README.</footer></main><script>
"use strict";
const people=[{id:"v",name:"Вейн Тихий",state:"ready",body:"Скелет",trade:"Не установлено",gear:["Меч","Щит","—","—","—"],note:"В лагере; можно обратиться лично."},{id:"m",name:"Марга Копатель",state:"wound",body:"Зомби",trade:"Копатель",gear:["Топор","—","—","—","—"],note:"Вернулась раненой. Лечение — через действующее взаимодействие."},{id:"h",name:"Брат Хальд",state:"away",body:"Не показано",trade:"Не установлено",gear:["Посох","—","—","—","—"],note:"В экспедиции; сведения на момент отправки."},{id:"l",name:"Лиска Лучник",state:"ready",body:"Скелет",trade:"Лучник",gear:["Кинжал","—","—","—","—"],note:"Ремесло не доказывает наличие боевого класса."},{id:"z",name:"Косой Ждан",state:"ready",body:"Скелет",trade:"Лучник",gear:["Кинжал","—","—","—","—"],note:"Примета относится к меткости; конкретный эффект требует проверки."},{id:"g",name:"Немой Гурт",state:"away",body:"Не показано",trade:"Не установлено",gear:["—","—","—","—","—"],note:"В экспедиции; сведения на момент отправки."},{id:"k",name:"Карган Старый Ворон",state:"guard",body:"Не показано",trade:"Не установлено",gear:["—","—","—","—","—"],note:"Телохранитель; недоступен для обычной отправки в этом примере."}];
const states={ready:"На месте",wound:"Ранен",away:"В походе",guard:"Телохранитель"},tabs=[["army","Воины"],["squads","Отряды"],["stock","Запасы"],["souls","Души"],["upgrades","Улучшения"]],subtabs=[["overview","Обзор"],["relations","Отношения"],["gear","Снаряжение"],["history","История"],["skills","Навыки"]];
const upgrades=[["Ледник","Установлено","Собранные души держатся дольше; больше времени для выбора оболочки."],["Казна","Принесено","С вылазок несут золото, и отряду есть чем заплатить. Установить в склепе."],["Каменные оковы","Не принесено","Устройство связывания выдерживает голема. В режиме «Перетягивание» правило другое: рецепт."]];
const relations=[["Марга Копатель","Благодарен","Поблагодарил Маргу за прикрытие в бою.","#9ab69b"],["Брат Хальд","Прислушивается","Принял его совет перед выходом.","#9ab69b"],["Косой Ждан","Обижен","Припомнил спор из-за добычи.","#cd9683"],["Лиска Лучник","Неоднозначно","Помог в бою, позднее спорил.","#c6a773"],["Немой Гурт","Неизвестно","Достоверных сведений нет.","#a69b86"]];
let tab="army",sub="overview",selected="v",filter="all",search="",graph=false,relIndex=0;const $=id=>document.getElementById(id);const w=()=>people.find(x=>x.id===selected);const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));const btn=(t,a,active=false,cl="")=>'<button type="button" class="'+cl+'" data-act="'+a+'" aria-pressed="'+active+'">'+esc(t)+'</button>';const block=(title,body)=>'<div class="block"><h3>'+title+'</h3>'+body+'</div>';const link=(t,a)=>btn(t,"route:"+a,false,"action");
function rel(){if(w().id!=="v")return '<p class="muted">В этом примере нет сведений об отношениях выбранного воина. Неизвестность не равна нейтральности.</p>';let body='<div class="row"><h3>Известные отношения</h3>'+btn(graph?"Список":"Связи","graph",graph,"subtle")+'</div><p class="muted">Направление: Вейн → товарищ. Обратное отношение не установлено.</p>';if(!graph)body+=relations.map((r,i)=>'<div class="entry">'+btn(r[0]+" · "+r[1],"rel:"+i,relIndex===i,"subtle")+'<p>'+r[2]+'</p></div>').join("");else{const positions=[[100,60],[420,60],[100,220],[420,220]];body+='<svg class="graph" viewBox="0 0 520 280" role="img" aria-label="Известные направленные связи Вейна"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#bdab88"/></marker></defs>'+relations.slice(0,4).map((r,i)=>{let [x,y]=positions[i],dx=x-260,dy=y-140,l=Math.hypot(dx,dy);return '<line x1="'+(260+dx/l*30)+'" y1="'+(140+dy/l*30)+'" x2="'+(x-dx/l*24)+'" y2="'+(y-dy/l*24)+'" stroke="'+r[3]+'" marker-end="url(#a)"/><circle cx="'+x+'" cy="'+y+'" r="25" fill="#362a1d" stroke="'+r[3]+'"/><text x="'+x+'" y="'+(y+4)+'" text-anchor="middle">'+r[0].split(" ")[0]+'</text>';}).join("")+'<circle cx="260" cy="140" r="29" fill="#493923" stroke="#c6a773"/><text x="260" y="145" text-anchor="middle">Вейн</text></svg><div class="toolbar">'+relations.map((r,i)=>btn(r[0].split(" ")[0],"rel:"+i,i===relIndex,"subtle")).join("")+'</div><p class="muted">Неизвестные связи не рисуются.</p>';}return body+'<div class="evidence"><strong>'+relations[relIndex][0]+' · '+relations[relIndex][1]+'</strong><p>'+relations[relIndex][2]+'</p><small>Условный известный эпизод, не прогноз.</small></div>';}
function details(){let a=w();const heading='<div class="head"><div class="portrait" aria-label="Место для портрета">♙</div><div><h2>'+a.name+'</h2><span class="'+a.state+'">'+states[a.state]+'</span><p class="muted">'+a.note+'</p></div></div><nav class="sub">'+subtabs.map(([id,n])=>btn(n,"sub:"+id,id===sub)).join("")+'</nav>';let b="";if(sub==="overview")b='<div class="facts"><div><small>Оболочка</small><strong>'+a.body+'</strong></div><div><small>Ремесло</small><strong>'+a.trade+'</strong></div><div><small>Класс</small><strong>Не подтверждён</strong></div></div>'+block("Личность","<p>Сведения души показываются по действующим правилам прозрачности. В макете нет достоверного снимка спектров.</p>")+block("Состояние","<p>"+a.note+"</p>"+(a.state==="wound"?link("К восстановлению","repair"):a.state==="away"?link("К походу","squads"):""))+block("Подготовка",btn("Осмотреть снаряжение","sub:gear")+btn("Известные отношения","sub:relations"));else if(sub==="relations")b=rel();else if(sub==="gear")b='<h3>Надетое · '+(a.state==="away"?"последние сведения":"условный пример")+'</h3>'+["Оружие","Щит / второе оружие","Шлем","Броня","Пояс"].map((n,i)=>'<div class="slot"><span>'+n+'</span><span>'+a.gear[i]+'</span></div>').join("")+block("Личное имущество","<p class='muted'>Карман и носимые вещи принадлежат воину, не Греховоду.</p>")+(a.state==="away"?'<div class="warning">Воин отсутствует. Обмен невозможен.</div>':link("К личному обмену","gear"));else if(sub==="history")b=block("Известная история","<p>Деяния, титулы и эпизоды — только из подтверждённых записей.</p><p class='muted'>В этом макете нет реального архива.</p>"+link("К архиву экспедиций","replay"));else b=block("Навыки и способности","<p>Ремесло: "+a.trade+".</p><p>Доступные боевые навыки должны читаться из реального каталога и состояния воина. Очков развития в макете нет.</p>");return heading+b;}
function roster(){const found=people.filter(a=>(filter==="all"||a.state===filter)&&a.name.toLowerCase().includes(search.toLowerCase()));$("roster").innerHTML=found.map(a=>'<button type="button" class="unit" data-act="unit:'+a.id+'" aria-pressed="'+(a.id===selected)+'">'+a.name+'<small class="'+a.state+'">'+states[a.state]+'</small></button>').join("")||'<p class="muted">Никого не найдено.</p>'; }
function render(){$("nav").innerHTML=tabs.map(([id,n])=>btn(n,"tab:"+id,tab===id)).join("");let b="";if(tab==="army"){b='<div class="layout"><aside class="side"><h3>Воины</h3><input id="search" type="search" placeholder="Поиск по имени" aria-label="Поиск по имени" value="'+esc(search)+'"><select id="filter" aria-label="Доступность">'+[["all","Все"],["ready","На месте"],["wound","Раненые"],["away","В походе"],["guard","Телохранитель"]].map(([id,n])=>'<option value="'+id+'" '+(filter===id?"selected":"")+'>'+n+'</option>').join("")+'</select><div class="roster" id="roster"></div></aside><section class="detail">'+details()+'</section></div>';}else if(tab==="squads")b='<h2 style="margin-top:18px">Отряды и походы</h2><div class="grid">'+block("В лагере","<p>Вейн, Марга, Лиска, Ждан, Карган.</p><p class='muted'>Доступность отдельных воинов проверяется перед отправкой.</p>"+link("К карте экспедиций","map"))+block("Отряд в пути","<p>Старший: Брат Хальд. Участник: Немой Гурт.</p><p class='muted'>Условная фаза: в пути к цели.</p>"+link("К действующему походу","map"))+block("История походов","<p>Только записанные реплеи и результаты.</p>"+link("К архиву","replay"))+block("Постоянные составы","<p>Концепция полной игры; не считаются существующей функцией.</p>")+'</div>';else if(tab==="stock")b='<h2 style="margin-top:18px">Запасы</h2><div class="grid">'+block("Мешок Греховода","<p>Личные вещи и монеты — не общее имущество армии.</p>"+link("Открыть мешок (I)","bag"))+block("Сундуки","<p>Осмотр при действительном доступе к объекту.</p>"+link("К взаимодействию","chest"))+block("Оплата","<p>Известные долги и средства; без выдуманного баланса.</p>"+link("К оплате","salary"))+block("Лечение","<p>Только вернувшиеся и реально раненые.</p>"+link("К восстановлению","repair"))+'</div>';else if(tab==="souls")b='<h2 style="margin-top:18px">Собранные души</h2>'+block("Банки Греховода","<p>Здесь перечисляются реально собранные души и доступные оболочки.</p><p class='muted'>Условный список пуст. Нет искусственно созданных душ.</p>"+link("К связыванию","bind"))+'<div class="warning">Только Греховод собирает души. Связывание не выполняется из обзорного меню.</div>';else b='<h2 style="margin-top:18px">Улучшения склепа</h2>'+upgrades.map(([n,s,e])=>block(n,'<p class="'+(s==="Установлено"?"active":"muted")+'">'+s+'</p><p>'+e+'</p>'+(s==="Принесено"?link("К месту установки","socket"):""))).join("")+'<p class="muted">Три существующих улучшения. Статусы условны, нет нового дерева строительства.</p>';$("view").innerHTML=b;if(tab==="army"){roster();$("search").addEventListener("input",e=>{search=e.target.value;roster()});$("filter").addEventListener("change",e=>{filter=e.target.value;roster()});}}
document.addEventListener("click",e=>{const el=e.target.closest("[data-act]");if(!el)return;const [kind,val]=el.dataset.act.split(":");$("status").textContent="";if(kind==="tab")tab=val;else if(kind==="sub")sub=val;else if(kind==="unit"){selected=val;relIndex=0;}else if(kind==="graph")graph=!graph;else if(kind==="rel")relIndex=Number(val);else if(kind==="route"){if(val==="squads"){tab="squads";render();return;}$("status").textContent="Макет: переход к существующему действию «"+el.textContent+"». Мир не изменён.";return;}render();});render();
</script></body></html>
