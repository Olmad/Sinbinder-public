<rect x="294" y="506" width="854" height="93" fill="#271f1e" stroke="#744c43"/>
<rect x="294" y="506" width="4" height="93" fill="#bc6252"/>
<text x="314" y="538" class="serif" font-size="23">Изменился только один фактор</text>
<text x="314" y="568" class="sans small">В реальной игре обе оценки должны исходить из одного снимка AOS.</text>
<text x="314" y="590" class="sans muted" font-size="13">В этом эскизе результат указан вручную, это НЕ вычисление BehaviourResolver.</text>
