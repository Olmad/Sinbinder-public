<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title description">
<title id="title">Sinbinder — Суд души: черновой макет</title>
<desc id="description">Редактируемый эскиз экрана: навигация, две панели сравнения настоящего решения и альтернативы, одно изменённое обстоятельство, качественные голоса тринадцати модулей. Данные демонстрационные.</desc>
