<text x="739" y="321" class="serif h">Изменили: не ранен</text>
<text x="739" y="352" class="serif body">Товарищ и противник прежние</text>
<text x="739" y="383" class="serif body">Сама история не меняется</text>
<line x1="739" y1="412" x2="1121" y2="412" stroke="#586e5b"/>
<text x="739" y="452" class="serif" font-size="26" fill="#b7d0b7">Пример: отступил</text>
