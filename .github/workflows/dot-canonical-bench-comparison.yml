name: Dot canonical AOS bench comparison
on:
  push:
    branches:
      - 'dot/verify-baseline'
permissions:
  contents: read
jobs:
  published-bench-fix:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: '0672fcee32f7b840eb137f51f25d0ddd49814c1a'
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Run full bench on the exact published fix
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = '0672fcee32f7b840eb137f51f25d0ddd49814c1a'
          sdk="$(dotnet --list-sdks | awk '$1 ~ /^8[.]/ {v=$1} END {print v}')"
          test -n "$sdk"
          printf '{"sdk":{"version":"%s"}}\n' "$sdk" > global.json
          dotnet run --project Tools/bench/bench.csproj -c Release -- 20000 > "$RUNNER_TEMP/moments-exact.log" 2>&1
          grep -Fx 'ESCAPE_RETELL completed=True attempted=True' "$RUNNER_TEMP/moments-exact.log"
          grep -F '=== ПОРОГ КОЛЕБАНИЯ ===' "$RUNNER_TEMP/moments-exact.log"
          if grep -E '^\s*(ПРОВАЛ|FAIL)(\s|:|!|$)' "$RUNNER_TEMP/moments-exact.log"; then exit 1; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: exact-Moments-bench-0672fce
          path: ${{ runner.temp }}/moments-exact.log
