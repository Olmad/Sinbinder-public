name: Dot Windows launcher save safety
on:
  push:
    branches: ['dot/verify-baseline']
permissions:
  contents: read
jobs:
  launcher-guard:
    runs-on: windows-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          ref: '006935617e5e87e8b2cbdf2f3276bb67bca37e17'
          fetch-depth: 2
          persist-credentials: false
      - name: Validate the generated CMD without launching Unity
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ((git rev-parse HEAD) -ne '006935617e5e87e8b2cbdf2f3276bb67bca37e17') { throw 'wrong candidate' }
          if ((git diff --name-only '4c4334951a20139e7f57e0a282b3d6c18b0fcb75' HEAD) -ne 'Tools/play/build-game.ps1') { throw 'unexpected changes' }
          git diff --check '4c4334951a20139e7f57e0a282b3d6c18b0fcb75' HEAD
          if ($LASTEXITCODE) { throw 'diff check failed' }
          $scriptFile = (Resolve-Path 'Tools/play/build-game.ps1').Path
          $tokens = $null
          $parseErrors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile($scriptFile,[ref]$tokens,[ref]$parseErrors)
          if ($parseErrors.Count) { throw ($parseErrors | Out-String) }
          $baseline = (git show '4c4334951a20139e7f57e0a282b3d6c18b0fcb75:Tools/play/build-game.ps1') -join "`n"
          if ($baseline -notmatch 'findstr /i /b' -or $baseline -notmatch 'reg delete' -or $baseline -notmatch 'rmdir /s /q') { throw 'baseline signature missing' }
          $source = Get-Content -LiteralPath $scriptFile -Encoding UTF8 -Raw
          $match = [regex]::Match($source, '(?ms)^\$launcher = @''\r?\n(.*?)\r?\n''@')
          if (!$match.Success) { throw 'launcher missing' }
          $launcher = $match.Groups[1].Value
          $pattern = '\A@echo off\r?\nchcp 65001 >nul\r?\n(?:echo [^&|<>%^!\r\n]+\r?\n){3}pause >nul\r?\nexit /b 1\z'
          if ($launcher -notmatch $pattern) { throw "unexpected wrapper commands: $launcher" }
          $fixture = Join-Path $env:RUNNER_TEMP 'sinbinder-launcher-fixture'
          $null = New-Item -ItemType Directory -Path $fixture
          $sentinel = Join-Path $fixture 'existing-save.json'
          [IO.File]::WriteAllText($sentinel,'keep me')
          $launcherPath = Join-Path $fixture 'Играть.cmd'
          [IO.File]::WriteAllText($launcherPath, $launcher.Replace("`r`n","`n").Replace("`n","`r`n"), [Text.UTF8Encoding]::new($false))
          Push-Location $fixture
          try {
            $output = & $env:ComSpec /d /v:off /c 'echo. | call "Играть.cmd"'
            if ($LASTEXITCODE -ne 1 -or $output.Count -lt 3) { throw "wrapper did not stop with a visible message: $output" }
            if ([IO.File]::ReadAllText($sentinel) -ne 'keep me') { throw 'sentinel changed' }
            Write-Host 'PASS Windows CMD showed the stop notice and exited without game launch or cleanup'
          } finally { Pop-Location }
          exit 0
