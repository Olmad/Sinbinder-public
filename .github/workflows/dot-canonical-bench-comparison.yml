name: Dot Dream CI reproduction
on:
  push:
    branches: ['dot/verify-baseline']
permissions:
  contents: read
jobs:
  dream-reproduction:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: '7c72b99cdef137802185d49452ac17b608b5fd7c'
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Reproduce and isolate the shim error on the current canonical SHA
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = '7c72b99cdef137802185d49452ac17b608b5fd7c'
          sdk="$(dotnet --list-sdks | awk '$1 ~ /^8[.]/ {v=$1} END {print v}')"
          test -n "$sdk"
          printf '{"sdk":{"version":"%s"}}\n' "$sdk" > global.json
          if dotnet build Tools/tutorial/TutorialChecks.csproj -c Release > "$RUNNER_TEMP/dream-before.log" 2>&1; then
            echo 'Original build passed; expected failure was not reproducible.'
            exit 1
          fi
          grep -E "CombatIntegrationShim.cs.*error CS0649.*Time.time" "$RUNNER_TEMP/dream-before.log"
          test "$(grep -Fc 'public static float time;' Tools/tutorial/CombatIntegrationShim.cs)" -eq 1
          sed -i 's/public static float time;/public static float time = 0f;/' Tools/tutorial/CombatIntegrationShim.cs
          git diff --check -- Tools/tutorial/CombatIntegrationShim.cs
          git diff -- Tools/tutorial/CombatIntegrationShim.cs > "$RUNNER_TEMP/dream-shim.patch"
          dotnet build Tools/tutorial/TutorialChecks.csproj -c Release
      - name: Execute original Dream rules
        run: dotnet run --no-build -c Release --project Tools/tutorial/TutorialChecks.csproj
      - name: Execute original syntax gate
        working-directory: Tools/tutorial
        run: |
          dotnet build SyntaxChecks.csproj -c Release
          dotnet run --no-build -c Release --project SyntaxChecks.csproj -- ../../Assets/Scripts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dream-ci-reproduction
          path: ${{ runner.temp }}/dream-*
