name: Dot TwinsCheck baseline
on:
  push:
    branches: ['dot/verify-baseline']
permissions:
  contents: read
jobs:
  twins-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: '7c72b99cdef137802185d49452ac17b608b5fd7c'
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Measure the canonical AOS twins baseline without changing weights
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = '7c72b99cdef137802185d49452ac17b608b5fd7c'
          sdk="$(dotnet --list-sdks | awk '$1 ~ /^8[.]/ {v=$1} END {print v}')"
          test -n "$sdk"
          printf '{"sdk":{"version":"%s"}}\n' "$sdk" > global.json
          dotnet run -c Release --project Tools/bench/bench.csproj -- двойники | tee "$RUNNER_TEMP/twins.log"
          git diff --exit-code
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: twins-baseline
          path: ${{ runner.temp }}/twins.log
