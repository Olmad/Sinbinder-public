name: Dot caravan return HUD regression
on:
  push:
    branches: ['dot/verify-baseline']
permissions:
  contents: read
jobs:
  caravan-hud:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: '1de1295cf090450fdcd775c7c08093b7f5bac9bf'
          fetch-depth: 3
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Check extracted HUD and actual F-selection logic without Unity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = '1de1295cf090450fdcd775c7c08093b7f5bac9bf'
          git diff --check '4c4334951a20139e7f57e0a282b3d6c18b0fcb75' HEAD
          sdk="$(dotnet --list-sdks | awk '$1 ~ /^8[.]/ {v=$1} END {print v}')"
          test -n "$sdk"
          printf '{"sdk":{"version":"%s"}}\n' "$sdk" > global.json
          export FIXTURE="$RUNNER_TEMP/caravan-hud"
          mkdir -p "$FIXTURE"
          cat > "$FIXTURE/Hud.csproj" <<'PROJECT'
          <Project Sdk="Microsoft.NET.Sdk"><PropertyGroup><OutputType>Exe</OutputType><TargetFramework>net8.0</TargetFramework></PropertyGroup></Project>
          PROJECT
          cat > "$FIXTURE/template" <<'CS'
          using System;
          using System.Collections.Generic;
          enum ExpeditionMapKind { SaltRoad, Chapel }
          enum Team { Neutral, Enemy }
          class Plan { public ExpeditionMapKind Kind; }
          class State { public bool CaravanPassed, CargoTaken, CaravanAssaulted=false; }
          struct Vector3 {
              public float x,y,z;
              public static Vector3 up => new Vector3 {y=1};
              public static Vector3 operator *(Vector3 a,float b) => new Vector3 {x=a.x*b, y=a.y*b, z=a.z*b};
              public static Vector3 operator +(Vector3 a,Vector3 b) => new Vector3 {x=a.x+b.x, y=a.y+b.y, z=a.z+b.z};
          }
          class Transform { public Vector3 position; }
          class Warrior { public bool IsDead=false; public Team Team; public readonly Transform transform=new(); public string DisplayName="Captain"; }
          static class Gaze { public static float Miss(object v,float r=0)=>0; }
          static class SinbinderPlayer { public static bool Exists=true; public static Vector3 Where; }
          static class Loc { public static string T(string s)=>s; public static string F(string s, string t)=>string.Format(s,t); public static string Name(string s)=>s; }
          class Program {
              static Program _active;
              bool _exiting;
              Plan _plan = new();
              State _state = new();
              List<Warrior> _guards = new();
              const float TalkReach=6f;
              Vector3 Gate=>new Vector3 {z=0};
              Vector3 Objective=>new Vector3 {z=40};
              static float Dist(Vector3 a,Vector3 b)=>Math.Abs(a.z-b.z);
              void Exit(){}
              void OpenCaravanChoice(){}
              void CollectObjective(){}
              //GONE
              //CAPTAIN
              //OFFER
              string Prompt(){
                  var captain=Captain();
                  //PROMPT
                  return prompt;
              }
              static void Main(string[] args){
                  const string back="Следуйте к бирюзовому огню, чтобы вернуться в склеп.";
                  const string fexit="F — вернуться в склеп", fgoal="F — исследовать цель", talk="F — говорить: Captain";
                  const string route="Следуйте к янтарному огню; бирюзовый огонь — путь назад.";
                  _active=new Program(); _active._plan.Kind=ExpeditionMapKind.SaltRoad;
                  _active._guards.Add(new Warrior { Team=Team.Neutral }); _active._guards[0].transform.position.z=46;
                  _active._state.CaravanPassed=true; _active._state.CargoTaken=true;
                  Check(40,back,null,"departure/farewell at old goal");
                  Check(20,back,null,"departure/farewell on road");
                  Check(0,fexit,fexit,"departure/farewell at gate");
                  if(args.Length>0)throw new Exception("negative control did not fail");
                  Check(46,back,null,"paid departure with captain still in scene");
                  _active=new Program {_state=new State {CaravanPassed=true,CargoTaken=true}};
                  Check(40,back,null,"revisit after restoring departure flags");
                  _active._state=new State();
                  _active._guards.Add(new Warrior {Team=Team.Neutral,CargoDummy=false}); _active._guards[0].transform.position.z=46;
                  Check(40,fgoal,fgoal,"caravan still present/failed toll");
                  Check(46,talk,talk,"caravan captain still available");
                  Check(20,route,null,"caravan still present/road");
                  _active._plan.Kind=ExpeditionMapKind.Chapel;
                  _active._state.CaravanPassed=true;
                  Check(40,fgoal,fgoal,"chapel unaffected");
                  Check(4,route,null,"exact exit threshold unchanged");
                  _active._exiting=true;
                  var offers=0;
                  OfferInteractions((n,s,a)=>offers++);
                  if(offers!=0) throw new Exception("exiting still offers interactions");
                  Console.WriteLine("PASS exiting interaction guard");
              }
              static void Check(int z,string desired,string expectedOffer,string label){
                  SinbinderPlayer.Where=new Vector3 {z=z};
                  string actualOffer=null;
                  OfferInteractions((n,s,a)=>actualOffer=s);
                  string actual=_active.Prompt();
                  if(actualOffer!=expectedOffer || actual!=desired)throw new Exception($"{label}: HUD '{actual}', F '{actualOffer}'");
                  Console.WriteLine("PASS "+label);
              }
          }
          CS
          sed -i 's/,CargoDummy=false//' "$FIXTURE/template"
          python3 - <<'PY'
          import os, pathlib, re, subprocess
          p = 'Assets/Scripts/Gameplay/PersonalExpedition.cs'
          current = pathlib.Path(p).read_text(encoding='utf-8')
          original = subprocess.check_output(['git','show','4c4334951a20139e7f57e0a282b3d6c18b0fcb75:'+p]).decode('utf-8-sig')
          folder = pathlib.Path(os.environ['FIXTURE'])
          template = (folder/'template').read_text()
          def pick(pattern, s):
              hits = re.findall(pattern,s,re.M|re.S)
              assert len(hits) == 1, (pattern,len(hits))
              return hits[0]
          for name,s in [('candidate',current),('baseline',original)]:
              code = template.replace('//GONE',pick(r'(^        private bool CaravanObjectiveGone =>[^;]+;)',s) if name=='candidate' else '')
              code = code.replace('//CAPTAIN',pick(r'(^        private Warrior Captain\(\).*?^        \})',s))
              code = code.replace('//OFFER',pick(r'(^        public static void OfferInteractions\(.*?^        \})',s))
              code = code.replace('//PROMPT',pick(r'(^            string prompt=.*?;\n)            string notice',s))
              (folder/(name+'.txt')).write_text(code)
          loc = pathlib.Path('Assets/Resources/Lang/en.txt').read_text(encoding='utf-8')
          assert loc.count('msgid "Следуйте к бирюзовому огню, чтобы вернуться в склеп."\nmsgstr "Follow the turquoise fire to return to the crypt."') == 1
          print('PASS exact English localization key')
          PY
          cp global.json "$FIXTURE/global.json"
          cd "$FIXTURE"
          cp candidate.txt Program.cs
          dotnet run --project Hud.csproj
          cp baseline.txt Program.cs
          dotnet build Hud.csproj
          ulimit -c 0
          if dotnet bin/Debug/net8.0/Hud.dll baseline > baseline.log 2>&1; then cat baseline.log; echo 'Baseline unexpectedly passed'; exit 1; fi
          cat baseline.log
          grep -q "departure/farewell at old goal: HUD 'F — исследовать цель', F ''" baseline.log
          echo 'PASS regression reproduced on baseline'
