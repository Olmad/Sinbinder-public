name: Unity cloud preflight (opt-in editor)

on:
  push:
    branches:
      - feature/server-prototype
    paths:
      - ".github/workflows/unity-cloud-smoke.yml"
      - "Assets/**"
      - "Tools/ci/**"
      - "Packages/**"
      - "ProjectSettings/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: unity-cloud-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Check Unity project shape (no license required)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: Run negative regression tests for preflight
        run: python3 -m unittest discover -s Tools/ci -p 'test_unity_preflight.py' -v
      - name: Validate project scene GUIDs and Editor smoke fixtures
        run: python3 Tools/ci/unity_preflight.py .

  editor-import:
    name: Unity 6000.3.22f1 import and EditMode NUnit smoke (opt-in)
    needs: preflight
    if: ${{ vars.SINBINDER_UNITY_CI_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: Unity Editor import, compilation and EditMode tests
        id: editor
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        with:
          projectPath: .
          unityVersion: 6000.3.22f1
          testMode: EditMode
          coverageEnabled: false
      - name: Upload Unity test results and logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sinbinder-unity-editmode-${{ github.sha }}
          path: artifacts
          if-no-files-found: warn
          retention-days: 7

# The Unity job remains skipped unless the repository variable
# SINBINDER_UNITY_CI_ENABLED is explicitly set to the string 'true'.
# A green preflight is only static L0, not Unity L3.
