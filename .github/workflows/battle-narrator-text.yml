name: Battle narrator semantic regression

on:
  push:
    branches:
      - feature/server-prototype
    paths:
      - 'Assets/Scripts/AOS Engine/BattleNarrator.cs'
      - 'Assets/Resources/Lang/en.txt'
      - 'Tools/logic/battle-narrator/**'
      - '.github/workflows/battle-narrator-text.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  truthfulness:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Compile actual BattleNarrator and check negative/positive contracts
        run: dotnet run --project Tools/logic/battle-narrator/BattleNarratorChecks.csproj --configuration Release
