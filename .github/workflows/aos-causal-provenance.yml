name: AOS causal provenance regressions

on:
  push:
    branches:
      - integration/stage1-aos-source-reviewed-2026-11-23
      - fix/aos-refusal-event-provenance-2026-11-23
  pull_request:
    paths:
      - "Assets/Scripts/AOS Engine/**"
      - "Assets/Scripts/Gameplay/SoulCourt*.cs"
      - "Assets/Scripts/Gameplay/CourtCaller.cs"
      - "Assets/Scripts/Gameplay/DreamTutorialDirector.cs"
      - "Assets/Scripts/UI/ScalesOverhead.cs"
      - "Assets/Scripts/UI/WarriorTooltipUI.cs"
      - "Assets/Resources/Lang/en.txt"
      - "Tools/logic/**"
      - ".github/workflows/aos-causal-provenance.yml"

permissions:
  contents: read

jobs:
  source-linked-causality:
    name: Run source-linked AOS provenance and text regressions
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Execute both real repository unittest modules
        run: python -m unittest Tools.logic.test_dream_court_ballot_replay Tools.logic.test_text_causality_regressions -v
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Force .NET 8 SDK (runner also has an incompatible SDK 11)
        run: |
          printf '%s\\n' '{"sdk":{"version":"8.0.100","rollForward":"latestFeature"}}' > global.json
          dotnet --version
      - name: Compile Roslyn C# syntax checker
        run: dotnet build Tools/tutorial/SyntaxChecks.csproj -c Release
      - name: Parse actual Unity gameplay C# sources
        run: dotnet run --no-build -c Release --project Tools/tutorial/SyntaxChecks.csproj -- Assets/Scripts
      - name: Compile production-linked AOS order regression suite
        run: dotnet build Tools/aos/AOSIntegrityTests.csproj -c Release
      - name: Run production-linked AOS order regression suite
        run: dotnet run --no-build -c Release --project Tools/aos/AOSIntegrityTests.csproj -- .

