name: AOS causal provenance regressions

on:
  push:
    branches:
      - integration/stage1-aos-source-reviewed-2026-11-23
      - fix/aos-refusal-event-provenance-2026-11-23
  pull_request:
    paths:
      - "Assets/Scripts/AOS Engine/**"
      - "Assets/Scripts/Gameplay/SoulCourt*.cs"
      - "Assets/Scripts/Gameplay/CourtCaller.cs"
      - "Assets/Scripts/Gameplay/DreamTutorialDirector.cs"
      - "Assets/Scripts/UI/ScalesOverhead.cs"
      - "Assets/Scripts/UI/WarriorTooltipUI.cs"
      - "Assets/Resources/Lang/en.txt"
      - "Tools/logic/**"
      - ".github/workflows/aos-causal-provenance.yml"

permissions:
  contents: read

jobs:
  source-linked-causality:
    name: Run source-linked AOS provenance and text regressions
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Execute both real repository unittest modules
        run: python -m unittest Tools.logic.test_dream_court_ballot_replay Tools.logic.test_text_causality_regressions -v
